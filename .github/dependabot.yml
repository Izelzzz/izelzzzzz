version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-opennext-cloudflare:
        patterns:
          - next
          - eslint-config-next
          - "@opennextjs/cloudflare"
          - "@opennextjs/*"
          - wrangler
          - "@cloudflare/*"
